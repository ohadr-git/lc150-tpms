<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0e14">
  <title>LC150 TPMS</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #141923;
      --card-border: #232d3f;
      --text-main: #ffffff;
      --text-muted: #718096;
      --ok: #22c55e;
      --offroad: #00b4ff;
      --alert: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    html, body {
      background: var(--bg);
      color: var(--text-main);
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body { display: flex; flex-direction: column; justify-content: space-between; }

    header {
      background: var(--card-bg); height: 48px; min-height: 48px; display: flex;
      align-items: center; justify-content: space-between; padding: 0 16px;
      border-bottom: 1px solid var(--card-border); flex-shrink: 0;
    }
    .brand { font-size: 13px; font-weight: 800; }
    .status-badge { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
    .status-connected { background: rgba(34, 197, 94, 0.2); color: var(--ok); }
    .status-disconnected { background: rgba(239, 68, 68, 0.2); color: var(--alert); }

    .main-grid {
      flex: 1; display: grid; grid-template-columns: 1fr 85px 1fr; grid-template-rows: 1fr 1fr auto;
      gap: 8px; padding: 10px; max-width: 480px; margin: 0 auto; width: 100%; align-items: center; min-height: 0;
    }
    
    .tire-card {
      background: var(--card-bg); border-radius: 12px; padding: 8px 10px; border: 2px solid var(--card-border);
      display: flex; flex-direction: column; justify-content: space-between; min-height: 80px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: border-color 0.2s, box-shadow 0.2s;
    }
    .tire-card.ok { border-color: var(--ok); }
    .tire-card.offroad { border-color: var(--offroad); box-shadow: 0 0 12px rgba(0, 180, 255, 0.35); }

    .card-hdr { font-size: 10px; font-weight: 700; color: var(--text-muted); }
    .card-val { font-size: 26px; font-weight: 900; line-height: 1.1; margin: 2px 0; }
    .card-unit { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-left: 2px; }
    .card-ftr { font-size: 11px; color: var(--text-muted); }

    #card-FL { grid-column: 1; grid-row: 1; }
    #card-FR { grid-column: 3; grid-row: 1; }
    #card-RL { grid-column: 1; grid-row: 2; }
    #card-RR { grid-column: 3; grid-row: 2; }
    #card-SP { grid-column: 2; grid-row: 3; margin: 0 -20px; padding: 6px 10px; }
    #card-SP .card-val { font-size: 20px; }

    .chassis-center { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; justify-content: center; }
    .chassis-center img { width: 100%; max-height: 190px; object-fit: contain; }

    footer {
      background: var(--card-bg); padding: 10px 12px 16px 12px; display: flex; gap: 6px;
      border-top: 1px solid var(--card-border); flex-shrink: 0; position: sticky; bottom: 0; z-index: 20;
    }
    button {
      flex: 1; background: #232d3f; border: none; color: white; padding: 10px 4px;
      font-size: 11px; font-weight: 700; border-radius: 8px; cursor: pointer;
    }
    button.btn-primary { background: #22c55e; color: #000; font-weight: 800; }
    button.btn-mock { background: #3b82f6; }
    button.btn-offroad { background: #00b4ff; color: #000; }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(11, 14, 20, 0.95);
      z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="brand" id="brand-lbl">LC150 TPMS | CONNECTING...</div>
    <div class="status-badge status-disconnected" id="ble-badge">DISCONNECTED</div>
  </header>

  <div class="main-grid" id="grid">
    <div class="tire-card ok" id="card-FL">
      <div class="card-hdr">FRONT LEFT</div>
      <div class="card-val"><span id="val-FL">--</span><span class="card-unit">PSI</span></div>
      <div class="card-ftr"><span id="temp-FL">--</span>°C</div>
    </div>

    <div class="chassis-center">
      <img id="chassis-img" src="assets/lc150_2015.svg" alt="Chassis">
    </div>

    <div class="tire-card ok" id="card-FR">
      <div class="card-hdr">FRONT RIGHT</div>
      <div class="card-val"><span id="val-FR">--</span><span class="card-unit">PSI</span></div>
      <div class="card-ftr"><span id="temp-FR">--</span>°C</div>
    </div>

    <div class="tire-card ok" id="card-RL">
      <div class="card-hdr">REAR LEFT</div>
      <div class="card-val"><span id="val-RL">--</span><span class="card-unit">PSI</span></div>
      <div class="card-ftr"><span id="temp-RL">--</span>°C</div>
    </div>

    <div class="tire-card ok" id="card-RR">
      <div class="card-hdr">REAR RIGHT</div>
      <div class="card-val"><span id="val-RR">--</span><span class="card-unit">PSI</span></div>
      <div class="card-ftr"><span id="temp-RR">--</span>°C</div>
    </div>

    <div class="tire-card ok" id="card-SP">
      <div class="card-hdr">SPARE</div>
      <div class="card-val"><span id="val-SP">--</span><span class="card-unit">PSI</span></div>
      <div class="card-ftr"><span id="temp-SP">--</span>°C</div>
    </div>
  </div>

  <footer>
    <button class="btn-primary" id="btn-ble">CONNECT</button>
    <button id="btn-profiles">PROFILES</button>
    <button class="btn-offroad" id="btn-sim-mode">OFF-ROAD</button>
    <button class="btn-mock" id="btn-pair">PAIR</button>
  </footer>

  <!-- PROFILES MODAL -->
  <div class="modal" id="modal-profiles">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">SELECT VEHICLE</h3>
      <div id="profile-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
        <p style="color:var(--text-muted); font-size:12px;">Waiting for connection...</p>
      </div>
      <button id="btn-close-prof" style="width: 100%;">CLOSE</button>
    </div>
  </div>

  <!-- PAIRING WIZARD MODAL -->
  <div class="modal" id="modal-wiz">
    <div class="modal-box">
      <h4 style="color: var(--offroad); margin-bottom: 6px;">PAIRING WIZARD</h4>
      <h2 id="wiz-step-name" style="margin-bottom: 8px;">FRONT LEFT</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Bleed ~2-3 PSI from this tire or tap button below:</p>
      <button class="btn-primary" id="btn-sim-step" style="width: 100%; margin-bottom: 10px; padding: 12px 0;">SIMULATE SENSOR BLEED</button>
      <button id="btn-wiz-cancel" style="width: 100%; background: var(--alert);">CANCEL</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const UART_SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let rxChar = null;
    let streamBuffer = "";

    async function toggleConnect() {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth not available in this context.");
        return;
      }
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "LC150-TPMS" }],
          optionalServices: [UART_SVC]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(UART_SVC);
        rxChar = await service.getCharacteristic(UART_RX);
        const txChar = await service.getCharacteristic(UART_TX);

        await txChar.startNotifications();
        streamBuffer = "";
        
        txChar.addEventListener("characteristicvaluechanged", (e) => {
          const chunk = new TextDecoder().decode(e.target.value);
          streamBuffer += chunk;
          
          let idx;
          while ((idx = streamBuffer.indexOf("\n")) >= 0) {
            const line = streamBuffer.substring(0, idx).trim();
            streamBuffer = streamBuffer.substring(idx + 1);
            if (line) {
              try {
                render(JSON.parse(line));
              } catch (err) {
                console.error("Malformed JSON:", err, line);
              }
            }
          }
        });

        document.getElementById("ble-badge").className = "status-badge status-connected";
        document.getElementById("ble-badge").textContent = "LIVE (BLE)";
        document.getElementById("btn-ble").textContent = "DISCONNECT";
        sendCmd("PING");
      } catch (err) {
        console.error("BLE Connect failed:", err);
      }
    }

    function render(data) {
      if (data.state === "WIZARD") {
        document.getElementById("modal-wiz").classList.add("active");
        document.getElementById("wiz-step-name").textContent = `STEP ${data.step_num}/${data.total_steps}: ${data.step}`;
        return;
      }
      document.getElementById("modal-wiz").classList.remove("active");

      const brand = document.getElementById("brand-lbl");
      const name = data.name || data.profile_name || "VEHICLE";
      brand.textContent = `${name.toUpperCase()} | ${data.mode}`;
      brand.style.color = data.mode === "OFFROAD" ? "var(--offroad)" : "var(--text-main)";

      if (data.asset) document.getElementById("chassis-img").src = `assets/${data.asset}.svg`;

      const cardSP = document.getElementById("card-SP");
      cardSP.style.display = data.layout === "5W" ? "flex" : "none";

      if (data.tires) {
        for (const [w, t] of Object.entries(data.tires)) {
          const valEl = document.getElementById(`val-${w}`);
          const tempEl = document.getElementById(`temp-${w}`);
          const card = document.getElementById(`card-${w}`);
          if (valEl) valEl.textContent = t.psi.toFixed(1);
          if (tempEl) tempEl.textContent = t.temp;
          if (card) card.className = data.mode === "OFFROAD" ? "tire-card offroad" : "tire-card ok";
        }
      }

      const profList = data.profiles || data.profiles_list;
      if (profList) {
        const list = document.getElementById("profile-list");
        list.innerHTML = "";
        profList.forEach(p => {
          const btn = document.createElement("button");
          const isActive = (p.id === data.profile || p.id === data.active_profile);
          btn.textContent = p.name + (isActive ? " (ACTIVE)" : "");
          btn.style.background = isActive ? "var(--offroad)" : "#232d3f";
          btn.style.color = isActive ? "#000" : "#fff";
          btn.style.padding = "12px 8px";
          btn.onclick = () => {
            sendCmd(`PROFILE:SELECT:${p.id}`);
            document.getElementById("modal-profiles").classList.remove("active");
          };
          list.appendChild(btn);
        });
      }
    }

    async function sendCmd(cmd) {
      if (!rxChar) return;
      try {
        const payload = new TextEncoder().encode(cmd + "\n");
        if (rxChar.writeValueWithoutResponse) {
          await rxChar.writeValueWithoutResponse(payload);
        } else {
          await rxChar.writeValue(payload);
        }
      } catch (err) {
        console.error("sendCmd err:", err);
      }
    }

    document.getElementById("btn-ble").onclick = toggleConnect;
    document.getElementById("btn-profiles").onclick = () => document.getElementById("modal-profiles").classList.add("active");
    document.getElementById("btn-close-prof").onclick = () => document.getElementById("modal-profiles").classList.remove("active");
    document.getElementById("btn-sim-mode").onclick = () => sendCmd("SIM:TOGGLE_MODE");
    document.getElementById("btn-pair").onclick = () => sendCmd("WIZARD:START");
    document.getElementById("btn-sim-step").onclick = () => sendCmd("SIM:DEFLATE_STEP");
    document.getElementById("btn-wiz-cancel").onclick = () => sendCmd("WIZARD:CANCEL");
  </script>
</body>
</html>
